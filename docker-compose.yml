version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reclaim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reclaim
      POSTGRES_PASSWORD: reclaim
      POSTGRES_DB: reclaim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: reclaim-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: reclaim-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build: ./backend
    container_name: reclaim-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: reclaim-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  minio-data:
